name: Monitor Verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
    paths:
      - 'tools/WorldGate.Monitor/**'
      - 'scripts/Verify-MonitorLayout.ps1'
      - '.github/workflows/monitor-verify.yml'
      - 'wsl-manager.sln'

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify monitor layout
        shell: pwsh
        run: ./scripts/Verify-MonitorLayout.ps1

      - name: Test monitor core
        shell: pwsh
        run: dotnet test ./tools/WorldGate.Monitor/tests/WorldGate.Monitor.Core.Tests/WorldGate.Monitor.Core.Tests.csproj --configuration Release

      - name: Build monitor Windows shell
        shell: pwsh
        run: dotnet build ./tools/WorldGate.Monitor/src/WorldGate.Monitor/WorldGate.Monitor.csproj --configuration Release -p:EnableWindowsTargeting=true
